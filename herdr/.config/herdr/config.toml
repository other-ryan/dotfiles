onboarding = false

[theme]
name = "nord"
auto_switch = false

[keys]
previous_agent = "prefix+shift+tab"
next_agent = "prefix+tab"

[ui]
agent_panel_sort = "spaces"

[experimental]
pane_history = true

[[keys.command]]
key = "prefix+/"
type = "shell"
command = "herdr pane split $HERDR_ACTIVE_PANE_ID --direction right --no-focus && sleep 0.1 && herdr pane split $HERDR_ACTIVE_PANE_ID --direction down --no-focus"
description = "Generate 3-pane left-split layout on active tab"
